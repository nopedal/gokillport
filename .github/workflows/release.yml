name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build all platforms
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          LDFLAGS="-s -w -X main.version=${VERSION}"
          mkdir -p dist

          GOOS=darwin  GOARCH=amd64 go build -ldflags "$LDFLAGS" -o dist/gokillport-darwin-amd64      ./cmd/gokillport
          GOOS=darwin  GOARCH=arm64 go build -ldflags "$LDFLAGS" -o dist/gokillport-darwin-arm64      ./cmd/gokillport
          GOOS=linux   GOARCH=amd64 go build -ldflags "$LDFLAGS" -o dist/gokillport-linux-amd64       ./cmd/gokillport
          GOOS=linux   GOARCH=arm64 go build -ldflags "$LDFLAGS" -o dist/gokillport-linux-arm64       ./cmd/gokillport
          GOOS=windows GOARCH=amd64 go build -ldflags "$LDFLAGS" -o dist/gokillport-windows-amd64.exe ./cmd/gokillport

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
